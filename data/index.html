<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nigga Firmware Updater</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</div>
    <div class="container">
      <div class="updater">
        <h2>Go 'head and get that system right</h2>

        <div id="version-status">Loading...</div>

        <div class="file-upload">
          <label for="file-input" class="custom-file-upload" id="file-label">
            Grab that .bin real quick.
          </label>
          <input
            id="file-input"
            type="file"
            accept=".bin"
            onchange="updateFileName()"
          />
        </div>
        <button id="upload-btn" class="btn" onclick="uploadFirmware()">
          Update Nigga
        </button>
        <button id="reboot-btn" class="btn btn-danger" onclick="rebootDevice()">
          Reboot Nigga
        </button>

        <div id="progress-container">
          <div id="progress-bar">0%</div>
        </div>
        <div id="status"></div>
      </div>
      <div class="esp-info-conatiner">
        <button class="btn" id="btn-info" onclick="fetchESPInfo()">
          Fetch Nigga's Info
        </button>
        <table id="esp-info-table"></table>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
