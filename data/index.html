<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homie Firmware Updater</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <!-- Background Decoration -->
    <div class="bg-blob"></div>

    <div class="container">
        <div class="card shadow-sm updater-card">
            <div class="card-body text-center">
                
                <!-- Top Buttons: theme on the left, actions on the right -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <button class="btn btn-icon-only theme-toggle" id="theme-toggle" onclick="toggleTheme()"
                            data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Toggle theme">🌙</button>
                    <div class="d-flex gap-3 align-items-center">
                    <button class="btn btn-icon-only" id="btn-info" onclick="toggleESPInfo()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Fetch Homie's Info">
                        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>
                    </button>
                    <button class="btn btn-icon-only" id="btn-settings" onclick="toggleSettings()"
                            data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Settings">
                        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.376l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.318z"/></svg>
                    </button>
                    <button id="reboot-btn" class="btn btn-icon-only" onclick="rebootDevice()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Reboot Homie">
                        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7.5 1v7h1V1h-1z"/><path d="M3 8.812a4.999 4.999 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812z"/></svg>
                        </button>
                    </div>
                </div>

                <h2 class="card-title mb-4 fw-bold">Go 'head and get that system right</h2>

                <div id="version-status" class="text-muted fst-italic mb-3">Loading...</div>

                <div class="file-upload mb-3">
                    <label for="file-input" class="custom-file-upload" id="file-label">
                        Grab that .bin real quick.
                    </label>
                    <input
                        id="file-input"
                        type="file"
                        accept=".bin"
                        onchange="updateFileName()"
                    />
                </div>

                <div class="d-grid gap-2">
                    <button id="upload-btn" class="btn btn-update-custom rounded-pill" sty onclick="uploadFirmware()">
                        <svg class="ico me-2" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z"/><path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.099z"/></svg> <span id="upload_btn_text">Update Homie</span>
                    </button>
                </div>

                <div id="progress-container" class="progress mt-3 rounded-pill" style="display: none; height: 25px;">
                    <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
                <div id="status" class="mt-3 text-muted"></div>

                <!-- Info Container (Hidden by default) -->
                <div id="info-container" class="mt-4" style="display: none;">
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="d-flex gap-2 align-items-center info-tabs">
                            <button type="button" class="btn info-tab active" id="tab-info"
                                    onclick="showInfoTab('info')">System Info</button>
                            <button type="button" class="btn info-tab" id="tab-logs"
                                    onclick="showInfoTab('logs')">Logs</button>
                        </div>
                        <div class="d-flex gap-3 align-items-center">
                        <button class="btn btn-icon-only" onclick="fetchESPInfo()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Refresh values"><svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg></button>
                            <button class="btn btn-icon-only" onclick="hideESPInfo()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Close">
                            <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854z"/></svg>
                        </button>
                        </div>
                    </div>
                    <div id="info-pane-info" class="table-responsive mt-3">
                        <table id="esp-info-table" class="table table-striped table-bordered table-hover text-start"></table>
                    </div>
                    <div id="info-pane-logs" class="mt-3 text-start" style="display: none;">
                        <div id="log-list" class="log-list"></div>
                    </div>
                </div>

                <!-- Settings Container (Hidden by default) -->
                <div id="settings-container" class="mt-4" style="display:none;">
                  <hr>
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Settings</h5>
                    <button class="btn btn-icon-only" onclick="hideSettings()"><svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854z"/></svg></button>
                  </div>
                  <div id="cred-warning" class="alert alert-warning py-2" style="display:none;">
                    Still using the default <code>admin</code>/<code>admin</code> login. Change it below.
                  </div>
                  <form id="settings-form" class="text-start" onsubmit="saveConfig(event)">
                    <label class="form-label">WiFi SSID</label>
                    <input class="form-control mb-2" id="cfg-wifi-ssid" required>
                    <label class="form-label">WiFi Password <small class="text-muted">(blank = unchanged)</small></label>
                    <input class="form-control mb-2" id="cfg-wifi-psk" type="password" placeholder="">
                    <label class="form-label">MQTT Host</label>
                    <input class="form-control mb-2" id="cfg-mqtt-host">
                    <label class="form-label">MQTT Port</label>
                    <input class="form-control mb-2" id="cfg-mqtt-port" type="number" min="1" max="65535">
                    <label class="form-label">MQTT User</label>
                    <input class="form-control mb-2" id="cfg-mqtt-user">
                    <label class="form-label">MQTT Password <small class="text-muted">(blank = unchanged)</small></label>
                    <input class="form-control mb-2" id="cfg-mqtt-pass" type="password">
                    <label class="form-label">MQTT Client ID <small class="text-muted">(identifies this board to the broker; must be unique)</small></label>
                    <input class="form-control mb-2" id="cfg-device-id">
                    <label class="form-label">mDNS Hostname</label>
                    <input class="form-control mb-2" id="cfg-mdns-host">
                    <label class="form-label">Updater Username</label>
                    <input class="form-control mb-2" id="cfg-upd-user">
                    <label class="form-label">Updater Password <small class="text-muted">(blank = unchanged)</small></label>
                    <input class="form-control mb-3" id="cfg-upd-pass" type="password">

                    <div class="form-check form-switch mb-3">
                      <input class="form-check-input" type="checkbox" id="cfg-ap-forced" onchange="toggleApMode(this.checked)">
                      <label class="form-check-label" for="cfg-ap-forced">Force AP mode</label>
                    </div>

                    <div class="d-grid gap-2">
                      <button type="submit" class="btn btn-update-custom rounded-pill">Save &amp; Reboot</button>
                      <button type="button" class="btn btn-outline-danger rounded-pill" onclick="factoryReset()">Factory Reset</button>
                    </div>
                  </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
