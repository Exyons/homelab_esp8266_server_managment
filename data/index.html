<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nigga Firmware Updater</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <!-- Background Decoration -->
    <div class="bg-blob"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle position-fixed top-0 end-0 p-3" id="theme-toggle" onclick="toggleTheme()">🌙</div>

    <div class="container">
        <div class="card shadow-sm updater-card">
            <div class="card-body text-center">
                
                <!-- Top Buttons (Reboot & Info) -->
                <div class="d-flex justify-content-end gap-3 mb-2">
                    <button class="btn btn-icon-only" id="btn-info" onclick="fetchESPInfo()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Fetch Nigga's Info">
                        <i class="bi bi-info-circle"></i>
                    </button>
                    <button id="reboot-btn" class="btn btn-icon-only" onclick="rebootDevice()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Reboot Nigga">
                        <i class="bi bi-power"></i>
                    </button>
                </div>

                <h2 class="card-title mb-4 fw-bold">Go 'head and get that system right</h2>

                <div id="version-status" class="text-muted fst-italic mb-3">Loading...</div>

                <div class="file-upload mb-3">
                    <label for="file-input" class="custom-file-upload" id="file-label">
                        Grab that .bin real quick.
                    </label>
                    <input
                        id="file-input"
                        type="file"
                        accept=".bin"
                        onchange="updateFileName()"
                    />
                </div>

                <div class="d-grid gap-2">
                    <button id="upload-btn" class="btn btn-update-custom rounded-pill" sty onclick="uploadFirmware()">
                        <i class="bi bi-cloud-arrow-up me-2"></i> <span id="upload_btn_text">Update Nigga</span>
                    </button>
                </div>

                <div id="progress-container" class="progress mt-3 rounded-pill" style="display: none; height: 25px;">
                    <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
                <div id="status" class="mt-3 text-muted"></div>

                <!-- Info Container (Hidden by default) -->
                <div id="info-container" class="mt-4" style="display: none;">
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">System Info</h5>
                        <button class="btn btn-icon-only" onclick="hideESPInfo()" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Hide Info">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <div class="table-responsive mt-3">
                        <table id="esp-info-table" class="table table-striped table-bordered table-hover text-start"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
